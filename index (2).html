<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#090d12;--pn:rgba(13,18,25,.93);--pn2:rgba(255,255,255,.035);--ln:rgba(255,255,255,.09);--tx:#e8eef4;--mu:#8b98a7;--ac:#5cc8ff;--ok:#3ddc97;--wa:#ffb547;--bad:#ff5c5c;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}
#map{position:fixed;inset:0;background:#0b1016;z-index:1}
#ov{position:fixed;left:0;top:0;pointer-events:none;z-index:450}
.leaflet-container{background:#0b1016;font:inherit}
.leaflet-control-attribution{background:rgba(9,13,18,.72)!important;color:#738191!important;font-size:10px!important;padding:1px 6px!important;border-radius:6px 0 0 0;margin-bottom:var(--sb)!important}
.leaflet-control-attribution a{color:#9cc3dd!important}
.glass{background:var(--pn);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--ln);box-shadow:0 6px 24px rgba(0,0,0,.35)}
#prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:1200;pointer-events:none;opacity:0;transition:opacity .3s}
#prog.on{opacity:1}
#progBar{height:100%;width:0;background:linear-gradient(90deg,#5cc8ff,#3ddc97);box-shadow:0 0 10px #5cc8ff;transition:width .25s}
#progTxt{position:fixed;top:calc(var(--st) + 64px);left:50%;transform:translateX(-50%);z-index:1100;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
#progTxt.on{opacity:1}
#top{position:fixed;z-index:1000;top:calc(var(--st) + 10px);left:calc(var(--sl) + 10px);right:calc(var(--sr) + 10px);display:flex;gap:8px;align-items:center}
.ib{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;padding:0}
.ib svg{width:22px;height:22px}
.brand{color:var(--ac)}
.search{flex:1;height:44px;border-radius:14px;display:flex;align-items:center;padding:0 6px 0 12px;gap:8px;min-width:0}
#sIcon{display:grid;place-items:center;flex:0 0 18px;color:var(--mu)}#sIcon svg{width:18px;height:18px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%;font-size:16px}
.search input::placeholder{color:#6f7c8b}
.search input::-webkit-search-cancel-button{display:none}
.qx{display:none;border:0;background:rgba(255,255,255,.1);width:26px;height:26px;border-radius:50%;padding:0;place-items:center}
.qx svg{width:14px;height:14px}
.search.has .qx{display:grid}
#sres{position:fixed;z-index:1001;top:calc(var(--st) + 60px);left:calc(var(--sl) + 10px);right:calc(var(--sr) + 10px);max-height:min(62vh,540px);overflow:auto;border-radius:14px;display:none}
#sres.on{display:block}
.sr-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);padding:10px 14px 4px;font-weight:600}
.sr-i{display:flex;align-items:center;gap:10px;padding:9px 14px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--ln)}
.sr-i:hover,.sr-i:active{background:rgba(255,255,255,.05)}
.sr-e{padding:14px;color:var(--mu);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;box-shadow:0 0 0 2px rgba(255,255,255,.07)}
.sr-t{flex:1;min-width:0}
.sr-t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-t span{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fabs{position:fixed;z-index:900;right:calc(var(--sr) + 10px);top:calc(var(--st) + 66px);display:flex;flex-direction:column;gap:8px}
.fab{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;padding:0}
.fab svg{width:21px;height:21px}
.fab.on{color:var(--ac);border-color:rgba(92,200,255,.45)}
#counts{position:fixed;z-index:900;left:calc(var(--sl) + 10px);bottom:calc(var(--sb) + 24px);display:flex;flex-wrap:wrap-reverse;gap:6px;max-width:calc(100% - 110px);transition:opacity .2s}
.cnt{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 8px;border-radius:999px;font-size:12px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.cnt svg{width:15px;height:15px}
.cnt.err{color:#ffb0b0}
.cnt.key{color:var(--wa)}
.spin{width:11px;height:11px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite;flex:0 0 11px}
@keyframes sp{to{transform:rotate(360deg)}}
#sheet{position:fixed;z-index:1050;left:0;right:0;bottom:0;max-height:62vh;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1),max-height .26s;display:flex;flex-direction:column;padding-bottom:var(--sb);border-bottom:0}
#sheet.on{transform:none}
#sheet.tall{max-height:calc(100% - var(--st) - 70px)}
.grab{height:22px;flex:0 0 22px;display:grid;place-items:center;cursor:pointer}
.grab::after{content:"";width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
#sheetBody{overflow:auto;padding:0 16px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media (max-width:759px){body.sheet-open #counts{opacity:0;pointer-events:none}}
@media (min-width:760px){body.sheet-open #counts{left:calc(var(--sl) + 422px)}}
@media (min-width:760px){
 #top{right:auto;width:420px}
 #sres{right:auto;width:420px}
 #sheet{left:calc(var(--sl) + 10px);right:auto;top:calc(var(--st) + 64px);bottom:16px;width:400px;max-height:none!important;border-radius:18px;transform:translateX(-112%);border-bottom:1px solid var(--ln)}
 #sheet.on{transform:none}
 .grab{display:none}
 #sheetBody{padding-top:14px}
 #counts{bottom:24px}
}
.hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.hd .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:0 0 38px}
.hd .ic svg{width:21px;height:21px}
.hd .tt{flex:1;min-width:0}
.hd h2{margin:1px 0 0;font-size:17px;line-height:1.25;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.hd p{margin:2px 0 0;color:var(--mu);font-size:13px}
.hb{width:36px;height:36px;border-radius:11px;border:1px solid var(--ln);background:var(--pn2);display:grid;place-items:center;padding:0;flex:0 0 36px}
.hb svg{width:18px;height:18px}
.hb.fav{color:#ffd166;border-color:rgba(255,209,102,.4)}
.rows{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:6px 0 12px;font-size:13.5px}
.rows dt{color:var(--mu)}
.rows dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.btn{height:36px;padding:0 13px;border-radius:11px;border:1px solid var(--ln);background:rgba(255,255,255,.05);display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;text-decoration:none;color:var(--tx);white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--ac);color:#04121c;border-color:transparent}
.btn.on{color:var(--ac);border-color:rgba(92,200,255,.5);background:rgba(92,200,255,.1)}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#05080b;aspect-ratio:16/10;margin:4px 0 10px;border:1px solid var(--ln);cursor:zoom-in}

const PG={pend:new Map(),done:0,hideT:0};
function progStart(id){PG.pend.set(id,0);progRender();}
function progStep(id,f){if(PG.pend.has(id)){PG.pend.set(id,clamp(f,0,.98));progRender();}}
function progEnd(id){if(PG.pend.delete(id))PG.done++;progRender();}
function progRender(){
 const n=PG.pend.size,tot=n+PG.done,bar=$('#prog'),tx=$('#progTxt');
 clearTimeout(PG.hideT);
 if(!n){$('#progBar').style.width='100%';tx.textContent='Klart 100 %';PG.hideT=setTimeout(()=>{bar.classList.remove('on');tx.classList.remove('on');PG.done=0;setTimeout(()=>{if(!PG.pend.size)$('#progBar').style.width='0';},320);},450);return;}
 let s=PG.done;PG.pend.forEach(v=>s+=v);const pct=Math.round(s/tot*100);
 bar.classList.add('on');tx.classList.add('on');$('#progBar').style.width=Math.max(4,pct)+'%';
 const names=[...PG.pend.keys()].map(k=>LAYERS[k].name.toLowerCase()).slice(0,2).join(', ');
 tx.textContent=`Laddar ${names} … ${pct} %`;
}

async function refresh(id,show){
 const st=ST[id],Ld=LAYERS[id];clearTimeout(st.timer);
 if(!st.on)return;
 if(document.hidden){st.stale=true;return;}
 if(st.busy)return;
 if(Ld.key&&!SET.tvKey){st.status='key';st.msg='Kräver Trafikverket-nyckel';uiAll();return;}
 if(Ld.wkey&&!SET.wKey){st.status='key';st.msg='Kräver gratis Windy-nyckel';uiAll();return;}
 st.busy=true;st.stale=false;if(show)progStart(id);if(!st.items.length)st.status='loading';uiAll();
 try{await Ld.load(st);st.status='ok';st.msg='';st.t=Date.now();st.fails=0;}
 catch(e){
  console.warn('[Sverige Live]',id,e);st.fails++;
  if(e.needKey){st.status='key';st.msg=e.message;}
  else{st.status='err';st.msg=errText(e);if(show)toast(`${Ld.name}: ${st.msg}`);}
 }finally{
  st.busy=false;if(show)progEnd(id);
  st.byId=new Map(st.items.map(i=>[i.id,i]));
  afterData(id);requestDraw();uiAll();
  if(st.on&&Ld.every&&st.status!=='key'){const wait=st.status==='err'?Math.min(Ld.every*Math.pow(2,st.fails),15*60000):Ld.every;st.timer=setTimeout(()=>refresh(id),wait);}
 }
}
function toggleLayer(id,on){
 const st=ST[id];st.on=on;saveOn();
 if(on){refresh(id,true);}
 else{clearTimeout(st.timer);if(sel&&sel.layer===id)closeSheet();}
 requestDraw();uiAll();
}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden)return;
 for(const id in ST){const st=ST[id],Ld=LAYERS[id];if(st.on&&(st.stale||(Ld.every&&Date.now()-st.t>Ld.every)))refresh(id);}
});

async function loadFlights(st){

async function fetchFlights(p){

 if(p.kind==='readsb'){
  const m=new Map();
  for(let i=0;i<FL_POINTS.length;i++){
   const[a,o]=FL_POINTS[i];const j=await getJSON(p.url(a,o),{},20000);
   for(const x of(j.ac||j.aircraft||[])){
    if(x.lat==null||x.lon==null||!x.hex)continue;if(x.seen_pos!=null&&x.seen_pos>90)continue;
    const pr=m.get(x.hex);if(!pr||(x.seen_pos||0)<(pr.seen_pos||0))m.set(x.hex,x);
   }
   progStep('flights',(i+1)/FL_POINTS.length);
   if(i<FL_POINTS.length-1)await sleep(p.gap||300);
  }
  return[...m.values()].map(x=>({id:String(x.hex).toLowerCase().replace(/^~/,''),lat:x.lat,lon:x.lon,cs:(x.flight||'').trim(),reg:x.r||'',type:x.t||'',desc:x.desc||'',
   ground:x.alt_baro==='ground',alt:typeof x.alt_baro==='number'?x.alt_baro:(typeof x.alt_geom==='number'?x.alt_geom:null),
   gs:x.gs!=null?+x.gs:null,trk:x.track!=null?+x.track:(x.true_heading!=null?+x.true_heading:null),vr:x.baro_rate!=null?+x.baro_rate:(x.geom_rate!=null?+x.geom_rate:null),
   sq:x.squawk||'',emerg:x.emergency&&x.emergency!=='none'?x.emergency:'',op:x.ownOp||'',t:now-(x.seen_pos||0)*1000}));
 }
 const j=await getJSON(p.url(),{},25000);progStep('flights',.95);
 return(j.states||[]).filter(s=>s[5]!=null&&s[6]!=null).map(s=>({id:String(s[0]),lat:s[6],lon:s[5],cs:(s[1]||'').trim(),reg:'',type:'',desc:'',ground:!!s[8],
  alt:s[7]!=null?s[7]/0.3048:(s[13]!=null?s[13]/0.3048:null),gs:s[9]!=null?s[9]*1.943844:null,trk:s[10],vr:s[11]!=null?s[11]*196.85:null,sq:s[14]||'',emerg:'',country:s[2],t:s[3]?s[3]*1000:now}));
}
function flColor(f){if(f.ground)return'#8b98a7';const a=f.alt==null?0:f.alt;return`hsl(${Math.round(42+150*clamp(a/40000,0,1))},92%,63%)`;}
function applyFlights(st,list){

  f.layer='flights';f.name=f.cs||f.reg||f.id.toUpperCase();f.cat=f.ground?'ground':(f.alt!=null&&f.alt<10000?'low':'high');

  let tr=trails.get(f.id);if(!tr){tr=[];trails.set(f.id,tr);}
  const l=tr[tr.length-1];if(!l||l[0]!==f.lat||l[1]!==f.lon)tr.push([f.lat,f.lon,f.t]);if(tr.length>60)tr.shift();

const MU=398600.4418,RE=6378.137,J2=1.08262668e-3,TAU=Math.PI*2;
function parseTLE(name,l1,l2){
 const yy=+l1.slice(18,20),day=parseFloat(l1.slice(20,32));const year=yy<57?2000+yy:1900+yy;
 const epoch=Date.UTC(year,0,1)+(day-1)*86400000;
 const ndot2=parseFloat(l1.slice(33,43))||0;
 const inc=parseFloat(l2.slice(8,16))*DEG,raan=parseFloat(l2.slice(17,25))*DEG,ecc=parseFloat('0.'+l2.slice(26,33).trim()),argp=parseFloat(l2.slice(34,42))*DEG,M0=parseFloat(l2.slice(43,51))*DEG,nRev=parseFloat(l2.slice(52,63));

 return{norad:l1.slice(2,7).trim(),name:name.trim(),epoch,inc,raan,ecc,argp,M0,nRev,n,a,ndot2,raanDot:-k*Math.cos(inc),argpDot:k*(2-2.5*Math.sin(inc)**2)};
}
function parseTLEText(txt){
 const L=txt.split(/\r?\n/).map(s=>s.replace(/\s+$/,'')),out=[];
 for(let i=0;i<L.length-1;i++){
  if(L[i].startsWith('1 ')&&L[i+1]&&L[i+1].startsWith('2 ')){const nm=i>0&&!L[i-1].startsWith('2 ')&&!L[i-1].startsWith('1 ')?L[i-1]:'NORAD '+L[i].slice(2,7);const s=parseTLE(nm,L[i],L[i+1]);if(s)out.push(s);i++;}

function gmst(t){const jd=t/86400000+2440587.5,d=jd-2451545.0,T=d/36525;let g=280.46061837+360.98564736629*d+0.000387933*T*T-T*T*T/38710000;g=((g%360)+360)%360;return g*DEG;}
function propagate(s,t){
 const dt=(t-s.epoch)/1000,dd=dt/86400;
 let M=s.M0+s.n*dt+TAU*s.ndot2*dd*dd;M=((M%TAU)+TAU)%TAU;
 let E=s.ecc<0.8?M:Math.PI;for(let i=0;i<15;i++){const d=(E-s.ecc*Math.sin(E)-M)/(1-s.ecc*Math.cos(E));E-=d;if(Math.abs(d)<1e-10)break;}

 const cu=Math.cos(u),su=Math.sin(u),cO=Math.cos(O),sO=Math.sin(O),ci=Math.cos(s.inc),si=Math.sin(s.inc);
 const x=r*(cO*cu-sO*su*ci),y=r*(sO*cu+cO*su*ci),z=r*su*si;
 const g=gmst(t),cg=Math.cos(g),sg=Math.sin(g);
 const xe=x*cg+y*sg,ye=-x*sg+y*cg;
 const pxy=Math.hypot(xe,ye),f=1/298.257223563,e2=f*(2-f);
 let lat=Math.atan2(z,pxy*(1-e2)),h=0;
 for(let i=0;i<5;i++){const sl=Math.sin(lat),N=RE/Math.sqrt(1-e2*sl*sl);h=pxy/Math.cos(lat)-N;lat=Math.atan2(z,pxy*(1-e2*N/(N+h)));}
 return{lat:lat/DEG,lon:((Math.atan2(ye,xe)/DEG+540)%360)-180,alt:h,vel:Math.sqrt(MU*(2/r-1/s.a))};
}
const fpKm=alt=>6371*Math.acos(6371/(6371+Math.max(alt,1)));
async function tleGroup(g){
 const ck='tle.'+g,c=LS.get(ck,null);
 if(c&&c.txt&&Date.now()-c.t<6*3600e3)return c.txt;
 try{const txt=await getText(`https://celestrak.org/NORAD/elements/gp.php?GROUP=${g}&FORMAT=tle`,{},40000);if(!/^1 \d/m.test(txt))throw new Error('CelesTrak gav inga banelement');LS.set(ck,{t:Date.now(),txt});return txt;}
 catch(e){if(c&&c.txt)return c.txt;throw e;}
}
async function issFallback(){const j=await getJSON('https://api.wheretheiss.at/v1/satellites/25544/tles',{},15000);return parseTLE(j.header||'ISS (ZARYA)',j.line1,j.line2);}
async function loadSats(st){
 const groups=SAT_GROUPS.map(g=>g[0]).filter(g=>!st.off.has(g));
 const recs=new Map(),errs=[];let i=0;
 for(const g of groups){
  try{for(const s of parseTLEText(await tleGroup(g)))if(!recs.has(s.norad))recs.set(s.norad,Object.assign(s,{group:g}));}
  catch(e){errs.push(e);if(g==='stations'){try{const s=await issFallback();if(s)recs.set(s.norad,Object.assign(s,{group:'stations'}));}catch(e2){}}}
  progStep('sats',++i/groups.length);
 }
 if(!recs.size&&errs.length)throw errs[0];
 st.src=errs.length?`CelesTrak (${errs.length} grupp(er) misslyckades)`:'CelesTrak';
 st.items=[...recs.values()].map(s=>({layer:'sats',id:s.norad,name:s.name,cat:s.group,color:SATG[s.group].color,s,lat:0,lon:0,alt:0,vel:0,near:false,station:s.group==='stations'}));

function propagateAll(t){for(const it of ST.sats.items){const p=propagate(it.s,t);it.lat=p.lat;it.lon=p.lon;it.alt=p.alt;it.vel=p.vel;it.near=hav(p.lat,p.lon,SWE_MID[0],SWE_MID[1])<1900;}}
let track=null,trackT=0;
function computeTrack(it){
 if(!it||!it.s){track=null;return;}
 const per=1440/it.s.nRev,step=Math.max(0.5,per/120),now=Date.now(),pts=[];
 for(let m=-per*0.25;m<=per*1.05;m+=step){const p=propagate(it.s,now+m*60000);pts.push([p.lat,p.lon,m>0]);}

const TV='https://api.trafikinfo.trafikverket.se/v2/data.json';
async function tvQuery(type,variants,limit){
 if(!SET.tvKey){const e=new Error('Kräver Trafikverket-nyckel');e.needKey=true;throw e;}
 const ck='tvv.'+type,start=clamp(LS.get(ck,0)|0,0,variants.length-1);let last;
 for(let k=0;k<variants.length;k++){
  const vi=(start+k)%variants.length,v=variants[vi];
  const body=`<REQUEST><LOGIN authenticationkey="${xmlEsc(SET.tvKey)}"/><QUERY objecttype="${type}"${v.ns?` namespace="${v.ns}"`:''} schemaversion="${v.ver}"${limit?` limit="${limit}"`:''}>${v.filter||''}</QUERY></REQUEST>`;
  try{
   const j=await getJSON(TV,{method:'POST',headers:{'Content-Type':'text/xml'},body},40000);
   const res=j&&j.RESPONSE&&j.RESPONSE.RESULT&&j.RESPONSE.RESULT[0];
   if(res&&res.ERROR){const er=new Error(res.ERROR.MESSAGE||'Fel från Trafikverket');er.tv=true;throw er;}
   LS.set(ck,vi);return(res&&res[type])||[];
  }catch(e){
   const b=e.body&&e.body.RESPONSE&&e.body.RESPONSE.RESULT&&e.body.RESPONSE.RESULT[0]&&e.body.RESPONSE.RESULT[0].ERROR;
   const msg=(b&&b.MESSAGE)||e.message||'';
   if(e.status===401||e.status===403||/authenticat|authoriz/i.test(msg)){const x=new Error('Trafikverket godkände inte nyckeln');x.needKey=true;throw x;}
   if(e.network||e.timeout)throw e;
   last=new Error('Trafikverket: '+(msg||errText(e)));
  }
 }
 throw last;
}

 if(it)select(it,true);else{closeSheet();map.flyTo([f.lat,f.lon],10);toast('Objektet finns inte i aktuell data – visar senast kända plats');}
}

/* ================= Sök ================= */
let sT=0,pT=0,lastQ='';
function searchStr(it){return[it.name,it.id,it.city,it.reg,it.type,it.cat,it.meta&&it.meta.callSign,it.meta&&it.meta.destination,it.loc,it.place,it.road].filter(Boolean).join(' ').toLowerCase();}
function doSearch(raw){
 const q=raw.trim().toLowerCase();lastQ=q;const box=$('#sres');
 if(q.length<2){box.classList.remove('on');box.innerHTML='';return;}
 const res=[];
 for(const id of PANEL_ORDER){const st=ST[id];if(!st.on||!st.items.length)continue;let n=0;const part=[];
  for(const it of st.items){const s=searchStr(it),i=s.indexOf(q);if(i<0)continue;part.push([i===0||s.indexOf(' '+q)>=0?0:1,it]);if(++n>=200)break;}
  part.sort((a,b)=>a[0]-b[0]);part.slice(0,8).forEach(p=>res.push(p[1]));}
 searchRes=res;
 let h='';let cur='';res.forEach((it,i)=>{if(it.layer!==cur){cur=it.layer;h+=`<div class="sr-h">${LAYERS[cur].name}</div>`;}const d=brief(it);h+=`<button class="sr-i" data-r="${i}"><span class="dot" style="background:${esc(it.color)}"></span><span class="sr-t"><b>${esc(d.title)}</b><span>${esc(d.sub||'')}</span></span></button>`;});
 h+=`<div id="sPlaces">${q.length>=3?'<div class="sr-h">Platser</div><div class="sr-e">Söker …</div>':''}</div>`;
 if(!res.length&&q.length<3)h='<div class="sr-e">Inga träffar i aktiva lager</div>';
 box.innerHTML=h;box.classList.add('on');
 clearTimeout(pT);if(q.length>=3)pT=setTimeout(()=>placeSearch(q),650);
}
let searchRes=[],placeRes=[];
async function placeSearch(q){
 try{const j=await getJSON(`https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=se&limit=6&accept-language=sv&q=${encodeURIComponent(q)}`,{},12000);
  if(q!==lastQ)return;placeRes=Array.isArray(j)?j:[];const el=$('#sPlaces');if(!el)return;
  el.innerHTML=placeRes.length?'<div class="sr-h">Platser</div>'+placeRes.map((p,i)=>`<button class="sr-i" data-p="${i}"><span class="dot" style="background:#8b98a7"></span><span class="sr-t"><b>${esc(String(p.display_name).split(',')[0])}</b><span>${esc(String(p.display_name).split(',').slice(1,4).join(','))}</span></span></button>`).join(''):(searchRes.length?'':'<div class="sr-e">Inga träffar</div>');
 }catch(e){const el=$('#sPlaces');if(el&&q===lastQ)el.innerHTML=searchRes.length?'':'<div class="sr-e">Inga träffar</div>';}
}
function closeSearch(){$('#sres').classList.remove('on');$('#q').blur();}

$('#bAbout').innerHTML=svg('logo');$('#bSet').innerHTML=svg('gear');$('#bLayers').innerHTML=svg('layers');$('#bFavs').innerHTML=svg('star');$('#bLoc').innerHTML=svg('loc');$('#bHome').innerHTML=svg('home');$('#sIcon').innerHTML=svg('search');$('#qx').innerHTML=svg('close');$('#vx').innerHTML=svg('close');

const q=$('#q');

$('#sres').addEventListener('click',e=>{
 const b=e.target.closest('.sr-i');if(!b)return;
 if(b.dataset.r!=null){const it=searchRes[+b.dataset.r];if(it){closeSearch();select(it,true);}}
 else if(b.dataset.p!=null){const p=placeRes[+b.dataset.p];if(p){closeSearch();if(sheetMode==='detail')closeSheet();const bb=p.boundingbox;if(bb&&bb.length===4)map.fitBounds([[+bb[0],+bb[2]],[+bb[1],+bb[3]]],{maxZoom:14});else map.flyTo([+p.lat,+p.lon],12);}}

 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='close')closeSheet();
 else if(a==='fav'&&sel&&sel.item){const on=toggleFav(sel.item);b.classList.toggle('fav',on);b.innerHTML=svg(on?'starF':'star');toast(on?'Sparad som favorit':'Borttagen från favoriter');}
 else if(a==='center'&&sel&&sel.item){const p=posOf(sel.item,Date.now());flyTo(p.lat,p.lon,Math.max(map.getZoom(),sel.layer==='sats'?4:10));}
 else if(a==='follow'&&sel){follow=!follow;b.classList.toggle('on',follow);if(follow){const p=posOf(sel.item,Date.now());flyTo(p.lat,p.lon);}}
 else if(a==='share')copyText(location.href.split('#')[0]+(sel?'#asset='+encodeURIComponent(sel.layer+':'+sel.id):''));
 else if(a==='viewer'&&sel)openViewer(sel.item);
 else if(a==='cam'){const it=ST.cameras.byId.get(b.dataset.id);if(it)select(it,true);}
 else if(a==='pick'){const it=multi[+b.dataset.i];if(it)select(it,false);}
 else if(a==='cat'){const id=b.dataset.l,k=b.dataset.k,st=ST[id];if(st.off.has(k))st.off.delete(k);else st.off.add(k);LS.set('off.'+id,[...st.off]);b.classList.toggle('on',!st.off.has(k));if(id==='sats'&&!st.off.has(k))refresh('sats',true);requestDraw();uiCounts();const c=$('#lc-'+id);if(c)c.textContent=fmt(visibleCount(id));}
 else if(a==='layers')openSheet('layers',layersHtml());
 else if(a==='settings')openSheet('settings',settingsHtml());
 else if(a==='about')openSheet('about',aboutHtml());
 else if(a==='gofav')goFav(b.dataset.k);
 else if(a==='unfav'){delete FAV[b.dataset.k];LS.set('favs',FAV);FAVSET=new Set(Object.keys(FAV));openSheet('favs',favsHtml());requestDraw();}
 else if(a==='savekey')saveKey();
 else if(a==='savewkey')saveWKey();
 else if(a==='saveckey'){SET.cartoKey=($('#cKey').value||'').trim();saveSet();LS.set('cartoCleared',!SET.cartoKey);setBase(SET.base);toast(SET.cartoKey?'CARTO-nyckeln är sparad':'Ingen CARTO-nyckel – OpenStreetMap används');}
 else if(a==='delwkey'){$('#wKey').value='';saveWKey().then(()=>openSheet('settings',settingsHtml()));}
 else if(a==='addlive'){if(sheetMode==='detail')setSel(null);openSheet('addlive',addLiveHtml());}
 else if(a==='savelive')saveLive();
 else if(a==='playlist'){if(sheetMode==='detail')setSel(null);openSheet('playlist',playlistHtml());}
 else if(a==='plv'){const r=LIVE_LIST[+b.dataset.i];if(!r)return;const it=r[3]!=null&&ST.live.byId.get('yt-'+r[0]);if(it)select(it,true);else openSheet('video',videoHtml(r));}
 else if(a==='dellive'&&sel&&sel.item&&sel.item.own){LS.set('mylive',LS.get('mylive',[]).filter(c=>String(c.id)!==sel.item.id));closeSheet();refresh('live');toast('Livekameran är borttagen');}
 else if(a==='wplay'&&sel&&sel.item)wPlay(sel.item,b.dataset.k);
 else if(a==='delkey'){SET.tvKey='';saveSet();LS.set('keyCleared',true);openSheet('settings',settingsHtml());for(const id of['cameras','trains','events']){ST[id].items=[];ST[id].byId=new Map();if(ST[id].on)refresh(id);}requestDraw();}
 else if(a==='base'){setBase(b.dataset.k);b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));}
 else if(a==='clearcache'){try{Object.keys(localStorage).filter(k=>/^svl\.(tle\.|infra|tvv\.|windy)/.test(k)).forEach(k=>localStorage.removeItem(k));}catch(err){}toast('Sparad data rensad');}
});
$('#sheetBody').addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.layer){toggleLayer(t.dataset.layer,t.checked);const ch=$('#lchips-'+t.dataset.layer);if(ch)ch.innerHTML=t.checked?chipsHtml(t.dataset.layer):'';}

function copyText(s){
 const ok=()=>toast('Länk kopierad');
 const fb=()=>{const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let r=false;try{r=document.execCommand('copy');}catch(e){}ta.remove();r?ok():toast('Kunde inte kopiera – länken finns i adressfältet');};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(ok,fb);else fb();
}
let toastT=0;
function toast(msg,action){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>`+(action?`<button>${esc(action.label)}</button>`:'');t.classList.toggle('act',!!action);if(action)t.querySelector('button').onclick=()=>{hideToast();action.fn();};t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(hideToast,action?7000:3200);}
function hideToast(){$('#toast').classList.remove('on','act');}

/* ===== Kartklick: välj objekt ===== */
map.on('click',e=>{
 if($('#sres').classList.contains('on')){closeSearch();return;}
 const x=e.containerPoint.x,y=e.containerPoint.y,R=18;const f=[];
 for(const it of HITS){const dx=it._x-x,dy=it._y-y,d=dx*dx+dy*dy;if(d<=R*R)f.push([d,it]);}
 if(!f.length){if(sheetMode)closeSheet();return;}
 f.sort((a,b)=>a[0]-b[0]);const d0=Math.sqrt(f[0][0]);const near=f.filter(v=>Math.sqrt(v[0])<=d0+5).map(v=>v[1]);
 if(near.length>1)showMulti(near);else select(f[0][1],false);
});

/* ===== Efter ny data ===== */
function afterData(id){
 if(sel&&sel.layer===id){const n=ST[id].byId.get(sel.id);if(n){sel.item=n;if(id==='sats')computeTrack(n);refreshDetail();if(follow){const p=posOf(n,Date.now());map.panTo([p.lat,p.lon]);}}}
 if(pendingAsset&&pendingAsset.layer===id){const it=ST[id].byId.get(pendingAsset.id);if(it){pendingAsset=null;select(it,true);}else if(ST[id].status!=='loading'&&!ST[id].busy&&ST[id].t)pendingAsset=null;}
}
function readHash(){
 const m=/^#asset=(.+)$/.exec(location.hash);if(!m)return;let k;try{k=decodeURIComponent(m[1]);}catch(e){return;}
 const i=k.indexOf(':');if(i<0)return;const layer=k.slice(0,i),id=k.slice(i+1);if(!LAYERS[layer])return;
 if(sel&&sel.layer===layer&&sel.id===id)return;
 pendingAsset={layer,id};
 if(!ST[layer].on)toggleLayer(layer,true);else afterData(layer);
}
window.addEventListener('hashchange',readHash);

/* ===== Klocka: animation, satelliter, uppdatering av detaljer ===== */
let satT=0;
setInterval(()=>{
 const now=Date.now();let need=false;
 if(ST.sats.on&&ST.sats.items.length&&now-satT>=2000){propagateAll(now);satT=now;need=true;if(sel&&sel.layer==='sats'&&now-trackT>30000)computeTrack(sel.item);}
 if(ST.flights.on&&ST.flights.items.length)need=true;
 if(follow&&sel&&sel.item&&MOVING.has(sel.layer)){const p=posOf(sel.item,now);map.panTo([p.lat,p.lon],{animate:true,duration:.9});}
 if(sheetMode==='detail'&&sel&&(sel.layer==='flights'||sel.layer==='sats'))refreshDetail();
 if(need&&!document.hidden)requestDraw();
},1000);

resize();
uiAll();
for(const id of PANEL_ORDER)if(ST[id].on)refresh(id,true);
readHash();
if(!SET.tvKey&&ST.cameras.on&&!LS.get('hint.key',false))setTimeout(()=>{toast('Lägg till en gratis Trafikverket-nyckel för att se kameror',{label:'Lägg till',fn:()=>openSheet('settings',settingsHtml())});LS.set('hint.key',true);},2200);
if(!SET.wKey&&ST.webcams.on&&!LS.get('hint.wkey',false))setTimeout(()=>{toast('Fler kameror: lägg till en gratis Windy-nyckel',{label:'Lägg till',fn:()=>openSheet('settings',settingsHtml())});LS.set('hint.wkey',true);},3000);
window.__svl={ST,SET,map,select,refresh,propagate,parseTLE,inSwe,toggleLayer,openSheet,layersHtml,settingsHtml,favsHtml,aboutHtml,doSearch,get HITS(){return HITS;}};
})();
